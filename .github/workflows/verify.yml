name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Environment and lockfile installation
        run: node --version && npm --version && git rev-parse HEAD && npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - name: Production build
        run: PAYLOAD_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')" DATABASE_URI="file:$RUNNER_TEMP/mvp-ci.db" npm run build
      - run: npm run typecheck
      - run: npm run security
      - name: Production migration and smoke
        run: |
          export PAYLOAD_SECRET="$(node -e 'console.log(require("crypto").randomBytes(32).toString("hex"))')"
          export DATABASE_URI="file:$RUNNER_TEMP/mvp-ci.db"
          export CONFIRM_DATABASE_URI="$DATABASE_URI"
          npm run db:migrate
          npm start &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:3000/ > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:3000/api/publications)" = 403
