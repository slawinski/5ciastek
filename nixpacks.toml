[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build", "ls -la .output/server"]
env = { NODE_ENV = "production", NITRO_PRESET = "node-server" }

[start]
cmd = "npm run start"

[variables]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"
PORT = "3000"
HOST = "0.0.0.0"
NITRO_HOST = "0.0.0.0"
NITRO_PORT = "3000"
